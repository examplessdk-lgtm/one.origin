name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: npm run build
        env:
          VITE_BASE44_APP_ID: 6ae19df388768a7d60e9828e
          VITE_BASE44_APP_BASE_URL: https://figma-make-app-60e9828e.base44.app
          VITE_ORIGIN_ENABLED: 'false'
